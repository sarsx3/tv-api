<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{background:linear-gradient(180deg,#02261a 0%,#04402c 55%,#006a4e 100%)}
.halo{position:absolute;left:50%;top:15%;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;
  background:radial-gradient(circle,rgba(244,42,65,.5),transparent 65%);animation:pulse 4.5s ease-in-out infinite;will-change:transform}
.sun{position:absolute;left:50%;top:15%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;
  background:#f42a41;animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both}
.t{position:absolute;left:0;right:0;top:29%;text-align:center;animation:fade 1.4s ease .7s both}
.h{margin:0;font:700 38px/1.25 system-ui,"Noto Sans Bengali",sans-serif;color:#f6f1e1}
.p{margin:8px 0 0;font:500 17px/1.4 system-ui,"Noto Sans Bengali",sans-serif;color:#bfe0d0}
.w{position:absolute;left:0;bottom:0;width:200%;animation:slide var(--t) linear infinite;will-change:transform}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.12);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="halo"></div><div class="sun"></div>
<div class="t"><h1 class="h" id="h"></h1><p class="p" id="p"></p></div>
<svg class="w" style="--t:34s;height:130px" viewBox="0 0 800 100" preserveAspectRatio="none"><path fill="#0a7a58" fill-opacity=".55" d="M0 40Q100 5 200 40T400 40T600 40T800 40V100H0Z"/></svg>
<svg class="w" style="--t:24s;height:105px;animation-direction:reverse" viewBox="0 0 800 100" preserveAspectRatio="none"><path fill="#075f45" fill-opacity=".8" d="M0 52Q100 20 200 52T400 52T600 52T800 52V100H0Z"/></svg>
<svg class="w" style="--t:17s;height:80px" viewBox="0 0 800 100" preserveAspectRatio="none"><path fill="#03301f" d="M0 60Q100 32 200 60T400 60T600 60T800 60V100H0Z"/></svg>
<script>
const P=Object.assign({title:'মহান বিজয় দিবস',sub:'১৬ ডিসেম্বর'},window.SPLASH_PARAMS||{});
document.getElementById('h').textContent=P.title;
document.getElementById('p').textContent=P.sub;
</script>
</body>
</html>
