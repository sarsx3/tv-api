<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#040705}
.b{position:absolute;left:50%;top:50%;width:90vmax;height:90vmax;margin:-45vmax 0 0 -45vmax;border-radius:50%;
  background:radial-gradient(circle,var(--c) 0,transparent 60%);opacity:.5;will-change:transform;
  animation:d var(--t) ease-in-out infinite alternate}
@keyframes d{from{transform:translate3d(var(--x0),var(--y0),0) scale(.9)}to{transform:translate3d(var(--x1),var(--y1),0) scale(1.1)}}
@media (prefers-reduced-motion:reduce){.b{animation:none}}
</style>
</head>
<body>
<div class="b" style="--c:#00d26a;--t:19s;--x0:-30vw;--y0:-22vh;--x1:12vw;--y1:6vh"></div>
<div class="b" style="--c:#0a7d8c;--t:25s;--x0:34vw;--y0:20vh;--x1:-10vw;--y1:-8vh;opacity:.4"></div>
<div class="b" style="--c:#2a2f9e;--t:31s;--x0:-8vw;--y0:34vh;--x1:20vw;--y1:-26vh;opacity:.32"></div>
</body>
</html>
