<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{background:linear-gradient(180deg,#06182a 0%,#0b3447 45%,#0f5a63 72%,#d79a45 100%)}
.s{position:absolute;border-radius:50%;background:#fff;animation:tw var(--d) ease-in-out var(--l) infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:.95}}
.moon{position:absolute;left:50%;top:6%;width:96px;height:96px;margin-left:-48px;filter:drop-shadow(0 0 16px rgba(255,214,130,.45))}
.t{position:absolute;left:0;right:0;top:23%;text-align:center;animation:in 1.5s cubic-bezier(.2,.7,.2,1) both}
.h{margin:0;font:700 46px/1.2 system-ui,"Noto Sans Bengali",sans-serif;color:#fbe7b0}
.p{margin:8px 0 0;font:500 16px/1.4 system-ui,sans-serif;letter-spacing:.1em;color:#c3dcd8}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.l{position:absolute;top:104%;width:30px;height:60px;animation:up var(--d) linear var(--l) infinite;will-change:transform}
.l i{display:block;width:100%;height:100%;animation:sw 3.4s ease-in-out infinite alternate;transform-origin:50% 0}
.l i::before{content:"";position:absolute;left:50%;top:-14px;width:1px;height:14px;background:#e8c27a}
.l i::after{content:"";position:absolute;left:-30px;top:-10px;width:90px;height:90px;
  background:radial-gradient(circle,rgba(255,200,100,.4),transparent 65%)}
.l b{position:absolute;left:3px;top:6px;width:24px;height:36px;border-radius:7px 7px 12px 12px;
  background:linear-gradient(#ffe09a,#ee9d33);z-index:1}
@keyframes up{from{transform:translate3d(0,0,0)}to{transform:translate3d(var(--dx),-125vh,0)}}
@keyframes sw{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
svg.m{position:absolute;left:0;bottom:0;width:100%;height:21%}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.l{top:40%}}
</style>
</head>
<body>
<svg class="moon" viewBox="0 0 100 100"><defs><mask id="k"><rect width="100" height="100" fill="#fff"/><circle cx="64" cy="40" r="38" fill="#000"/></mask></defs>
<circle cx="46" cy="52" r="40" fill="#f6d98e" mask="url(#k)"/></svg>
<div class="t"><h1 class="h" id="h"></h1><p class="p" id="p"></p></div>
<svg class="m" viewBox="0 0 390 120" preserveAspectRatio="xMidYMax slice"><g fill="#03101a">
<rect x="0" y="100" width="390" height="20"/><rect x="120" y="84" width="150" height="20"/>
<path d="M135 84a60 50 0 0 1 120 0z"/><rect x="194" y="22" width="2" height="14"/><circle cx="195" cy="20" r="3"/>
<rect x="92" y="40" width="10" height="64"/><path d="M90 40L97 18L104 40z"/>
<rect x="288" y="40" width="10" height="64"/><path d="M286 40L293 18L300 40z"/>
<path d="M30 100a22 20 0 0 1 44 0z"/><path d="M316 100a22 20 0 0 1 44 0z"/></g>
<g fill="#f2d48a" opacity=".85"><rect x="150" y="90" width="6" height="9"/><rect x="192" y="90" width="6" height="9"/><rect x="234" y="90" width="6" height="9"/></g></svg>
<script>
const P=Object.assign({title:'ঈদ মুবারক',sub:'Eid Mubarak'},window.SPLASH_PARAMS||{});
document.getElementById('h').textContent=P.title;
document.getElementById('p').textContent=P.sub;
const b=document.body,r=(a,z)=>a+Math.random()*(z-a);
for(let i=0;i<36;i++){
  const e=document.createElement('div'),z=r(1,2.4);
  e.className='s';
  e.style.cssText=`left:${r(0,100)}%;top:${r(0,58)}%;width:${z}px;height:${z}px;--d:${r(2.2,5)}s;--l:-${r(0,5)}s`;
  b.appendChild(e);
}
[6,15,22,78,86,93].forEach((x,i)=>{
  const e=document.createElement('div');
  e.className='l';
  e.style.cssText=`left:${x}%;--d:${r(20,32)}s;--l:-${r(0,26)}s;--dx:${r(-24,24)}px`;
  e.innerHTML='<i><b></b></i>';
  b.appendChild(e);
});
</script>
</body>
</html>
