name: Update Sports Data

# ============================================================
# এই workflow প্রতি ৩০ মিনিটে automatically চলবে এবং আপনার
# বিদ্যমান "sports" ফোল্ডারের ভেতরে football.json, cricket.json ও
# status.json তৈরি/আপডেট করবে। repo-র বাকি কোনো ফাইলে এটি হাত দেয় না।
#
# v3 আপডেট:
#   - ফুটবল ডাটা এখন API-Football-এর বদলে football-data.org থেকে আসে
#     (GitHub Actions-এর shared IP-তে account suspend হওয়ার সমস্যা এড়াতে)।
#     FOOTBALL_API_KEY সিক্রেটে football-data.org-এর টোকেন বসাতে হবে।
#   - football.json / cricket.json এখন সবসময় একটা স্পষ্ট status.state
#     সহ লেখা হয়: "ok" (নতুন ডাটা), "no_matches" (সত্যিই কোনো ম্যাচ নেই),
#     "quota_paused" (আজকের API সীমার কাছাকাছি — শুধু cricket-এ প্রযোজ্য)
#     বা "error" (fetch ব্যর্থ)।
#   - sports/.meta/cricket_quota.json ক্রিকেট API-এর দৈনিক রিকোয়েস্ট
#     সংখ্যা ট্র্যাক করে, যাতে কখনোই দৈনিক লিমিট পার না হয়। ফুটবলের
#     জন্য আলাদা quota ফাইলের দরকার নেই (per-minute rate limit)।
#   - sports/status.json — দুই sport-এর এক-নজরে সারাংশ, ড্যাশবোর্ডের জন্য।
# ============================================================

on:
  schedule:
    - cron: "*/30 * * * *"     # প্রতি ৩০ মিনিট পরপর
  workflow_dispatch: {}        # "Actions" ট্যাব থেকে ম্যানুয়ালি চালানোর জন্য

permissions:
  contents: write

concurrency:
  group: update-sports-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository checkout করা
        uses: actions/checkout@v4

      - name: Python সেটআপ করা
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: প্রয়োজনীয় Python package ইনস্টল করা
        run: pip install -r requirements.txt

      - name: Football ও Cricket ডাটা fetch করা
        env:
          # ⚠️ football-data.org-এর টোকেন এখানে বসাবেন (আগের API-Football
          # key না) — GitHub repo → Settings → Secrets and variables →
          # Actions → FOOTBALL_API_KEY আপডেট করুন।
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          CRICKET_API_KEY: ${{ secrets.CRICKET_API_KEY }}
          # ঐচ্ছিক: ক্রিকেট API-এর দৈনিক সীমা ভিন্ন হলে override করুন।
          # CRICKET_DAILY_LIMIT: "100"
          # CRICKET_SAFE_CAP: "90"
        run: python scripts/fetch_sports_data.py

      - name: sports/ ফোল্ডারে পরিবর্তন থাকলে commit ও push করা
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sports/football.json sports/cricket.json sports/status.json sports/error_log.txt sports/.meta/*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "কোনো নতুন পরিবর্তন নেই, তাই commit করা হচ্ছে না।"
          else
            git commit -m "Auto update sports data - $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
